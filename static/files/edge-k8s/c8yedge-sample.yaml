---
##
## This Custom Resource deploys C8y Edge version 2025.0.1 named 'c8yedge' 
## accessible at 'https://myown.iot.com' URL with self-signed certificates.
##

apiVersion: edge.cumulocity.com/v1
kind: CumulocityIoTEdge
metadata:
  name: c8yedge						                                        
  namespace: c8yedge                                                        
spec:
  version: "2025.0.1" #Replace with the desired version of C8y Edge here                                                      
  licenseKey: aacaffe661936cf13bd297f1c27db66405ca639b48e22b62b37c0090f1b521b8f4dd9edb4fed829b1a12db760a707012ba2329e503453d32c4baaa610da38df3 #Replace with your license key here

  company: IoT Company #Replace with your company name here                                                     
  domain: myown.iot.com #Replace with your domain name here                                                     
  email: company@edgebootstrap.example #Retain this email address                                                      
