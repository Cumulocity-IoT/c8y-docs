# Production
baseURL                = "https://cumulocity.com/docs"
languageCode           = "en-us"
defaultContentLanguage = "en-us"
title                  = "Cumulocity documentation"
theme                  = "c8ydocs"
publishDir             = "public"
summaryLength          = 30
buildFuture            = true
relativeURLs           = true
enableGitInfo          = true

# canonifyurls = false
# googleAnalytics = "UA-xxxxxxxx-x"

[taxonomies]
  sectors = "sector"

[outputs]
  home = ["HTML", "llmstxt", "llms-full", "securitytxt"]

[outputFormats.llmstxt]
  mediaType    = "text/plain"
  baseName     = "llms"
  isPlainText  = true
  notAlternative = true
  suffixes     = ["txt"]

[outputFormats.llms-full]
  mediaType    = "text/plain"
  baseName     = "llms-full"
  isPlainText  = true
  notAlternative = true
  suffixes     = ["txt"]

# RFC 9116 security.txt, rendered by layouts/index.securitytxt.txt
[outputFormats.securitytxt]
  mediaType    = "text/plain"
  baseName     = "security"
  path         = ".well-known"
  isPlainText  = true
  notAlternative = true
  suffixes     = ["txt"]

[markup]
  [markup.goldmark]
    [markup.goldmark.renderer]
      unsafe = true
  [markup.highlight]
    style = "solarized-dark256"

[params]
  # Global keywords added to every page
  keywords = ["Cumulocity", "Internet of things", "analytics", "devices", "connect"]

  description  = "This documentation offers comprehensive information on the var-product-c8y-iot platform both from a user and from a developer perspective. It reflects the latest state of the var-product-c8y-iot platform and is continuously updated to align with recent software updates."
  oldguides    = "//cumulocity.com/guides/welcome/intro-documentation/"
  logo         = "images/logo-platform.svg"
  favicon      = "//cumulocity.com/favicon.ico"

  # Can be a boolean 'false' or a string (example: 'CD' or a release version like '2024').
  # This flag displays the admonition stating it is a preview version.
  docsPreview = false

  # Display thumbnail image of each post on index pages (false: disabled, true: enabled)
  thumbnailImage = true

  # Content variables for front matter titles
  product_c8y_iot  = "Cumulocity"
  company_sag      = "Software AG"
  enterprise_tenant = "Enterprise tenant"

  [[params.author]]
    name = "Carlos Ceia @ Cumulocity"

  [[params.additionalResources]]
    name = "Tech Community"
    link = "https://community.cumulocity.com/"

  [[params.additionalResources]]
    name = "Learning Portal"
    link = "https://learning.cumulocity.com/"

  [[params.additionalResources]]
    name = "YouTube"
    link = "https://www.youtube.com/@CumulocityIoT"

  [[params.additionalResources]]
    name = "REST API documentation"
    link = "https://cumulocity.com/api/"

  [[params.additionalResources]]
    name = "CLI documentation"
    link = "https://goc8ycli.netlify.app/docs/introduction/"

  [[params.additionalResources]]
    name = "Platform status"
    link = "https://status.cumulocity.com/"

  [[params.additionalResources]]
    name = "Product Support"
    link = "https://cumulocity.atlassian.net/servicedesk/customer/portals"

  [[params.additionalResources]]
    name = "Glossary"
    link = "/glossary/"

  [params.footer]
    copyright = "Cumulocity GmbH | <a href='/legal-notices/imprint/'> Imprint</a> | <a href='/legal-notices/privacy-notice/'>Privacy notice</a>"
    c8ylink   = "https://cumulocity.com"
