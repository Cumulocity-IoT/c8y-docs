<div class="mermaid" style="width: 100%; padding-bottom: 2em;">
  {{- .Inner | safeHTML }}
</div>

{{ if not (.Page.Store.Get "hasMermaid") }}
<script type="module">
  import mermaid from 'https://cdn.jsdelivr.net/npm/mermaid/dist/mermaid.esm.min.mjs';
  mermaid.initialize({
        theme: 'base',
        themeVariables: {
          primaryColor: '#c1e6c1',
          activationBkgColor: '#119d11',
        }
      });
</script>
{{ end }}

{{ .Page.Store.Set "hasMermaid" true }}
