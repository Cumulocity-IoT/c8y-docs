<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Link checker log analyzer</title>
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4"></script>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: system-ui, sans-serif;
      background: #f5f5f5;
      color: #222;
      padding: 2rem;
      min-height: 100vh;
    }

    h1 { font-size: 1.5rem; margin-bottom: 1.5rem; }

    .input-section {
      background: #fff;
      border: 1px solid #ddd;
      border-radius: 8px;
      padding: 1.25rem;
      margin-bottom: 1.5rem;
    }

    label { display: block; font-weight: 600; margin-bottom: 0.5rem; }

    textarea {
      width: 100%;
      height: 220px;
      font-family: monospace;
      font-size: 0.8rem;
      border: 1px solid #ccc;
      border-radius: 4px;
      padding: 0.75rem;
      resize: vertical;
      white-space: pre;
    }

    .actions { margin-top: 0.75rem; display: flex; align-items: center; gap: 1rem; }

    button {
      background: #0066cc;
      color: #fff;
      border: none;
      border-radius: 4px;
      padding: 0.5rem 1.25rem;
      font-size: 0.95rem;
      cursor: pointer;
    }
    button:hover { background: #0055aa; }

    #summary {
      font-size: 0.9rem;
      color: #555;
    }

    .charts {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 1.5rem;
    }

    @media (max-width: 700px) {
      .charts { grid-template-columns: 1fr; }
    }

    .chart-card {
      background: #fff;
      border: 1px solid #ddd;
      border-radius: 8px;
      padding: 1.25rem;
    }

    .chart-card h2 { font-size: 1rem; margin-bottom: 1rem; }

    canvas { width: 100% !important; }
  </style>
</head>
<body>

<h1>Link checker log analyzer</h1>

<div class="input-section">
  <label for="logInput">Paste log output</label>
  <textarea id="logInput" spellcheck="false" placeholder="Paste your test log here…"></textarea>
  <div class="actions">
    <button onclick="analyze()">Analyze</button>
    <span id="summary"></span>
  </div>
</div>

<div class="charts">
  <div class="chart-card">
    <h2>Response time distribution</h2>
    <canvas id="timeChart"></canvas>
  </div>
  <div class="chart-card">
    <h2>Attempts per URL</h2>
    <canvas id="attemptsChart"></canvas>
  </div>
</div>

<script>
  let timeChart, attemptsChart;

  function analyze() {
    const raw = document.getElementById('logInput').value;
    const lines = raw.split('\n');

    // Track max attempt number seen per URL before its ✓ or failure line.
    const attemptMap = {};   // url -> max attempt number seen
    const times = [];        // all durations in ms
    const attempts = [];     // attempt count per successful URL
    let failedCount = 0;     // URLs where all attempts exhausted without success

    for (const line of lines) {
      // Match attempt lines: (Attempt N of M) should validate URL: <url>
      const attemptMatch = line.match(/\(Attempt\s+(\d+)\s+of\s+\d+\)\s+should validate URL:\s+(\S+)/);
      if (attemptMatch) {
        const n = parseInt(attemptMatch[1], 10);
        const url = attemptMatch[2];
        attemptMap[url] = Math.max(attemptMap[url] || 0, n);
        continue;
      }

      // Match success lines: ✓ should validate URL: <url> (NNNms)
      const successMatch = line.match(/✓\s+should validate URL:\s+(\S+)\s+\((\d+)ms\)/);
      if (successMatch) {
        const url = successMatch[1];
        const ms  = parseInt(successMatch[2], 10);
        times.push(ms);
        attempts.push(attemptMap[url] ? attemptMap[url] + 1 : 1);
        delete attemptMap[url];
        continue;
      }

      // Match failure lines: N) should validate URL: <url>
      const failureMatch = line.match(/\d+\)\s+should validate URL:\s+(\S+)/);
      if (failureMatch) {
        const url = failureMatch[1];
        failedCount++;
        delete attemptMap[url];
      }
    }

    document.getElementById('summary').textContent =
      `Parsed ${times.length} completed URL${times.length !== 1 ? 's' : ''}` +
      (failedCount ? `, ${failedCount} failed.` : '.');

    renderTimeChart(times);
    renderAttemptsChart(attempts, failedCount);
  }

  // ── Time histogram ──────────────────────────────────────────────────────────

  function buildTimeBins(times) {
    const edges = [0, 500, 1000, 1500, 2000, 2500, 3000, 4000, 5000, 7500, Infinity];
    const maxTime = Math.max(...times);
    const labels = edges.slice(0, -1).map((e, i) => {
      const next = edges[i + 1];
      return next === Infinity ? `>${e}ms (max ${maxTime}ms)` : `${e}–${next}ms`;
    });
    const counts = new Array(labels.length).fill(0);
    for (const t of times) {
      for (let i = 0; i < edges.length - 1; i++) {
        if (t >= edges[i] && t < edges[i + 1]) { counts[i]++; break; }
      }
    }
    return { labels, counts };
  }

  function renderTimeChart(times) {
    const { labels, counts } = buildTimeBins(times);
    const ctx = document.getElementById('timeChart').getContext('2d');

    if (timeChart) timeChart.destroy();
    timeChart = new Chart(ctx, {
      type: 'bar',
      data: {
        labels,
        datasets: [{
          label: 'URLs',
          data: counts,
          backgroundColor: '#4a90d9',
          borderRadius: 4,
        }]
      },
      options: {
        plugins: { legend: { display: false } },
        scales: {
          x: { title: { display: true, text: 'Response time' } },
          y: { title: { display: true, text: 'Number of URLs' }, beginAtZero: true, ticks: { precision: 0 } }
        }
      }
    });
  }

  // ── Attempts histogram ──────────────────────────────────────────────────────

  function renderAttemptsChart(attempts, failedCount = 0) {
    if (!attempts.length && !failedCount) return;
    const maxAttempt = attempts.length ? Math.max(...attempts) : 0;
    const labels = Array.from({ length: maxAttempt }, (_, i) => `${i + 1}`);
    const counts = new Array(maxAttempt).fill(0);
    for (const a of attempts) counts[a - 1]++;

    if (failedCount) {
      labels.push('Failed');
      counts.push(failedCount);
    }

    const colors = counts.map((_, i) =>
      labels[i] === 'Failed' ? '#b71c1c' : i === 0 ? '#4caf50' : '#e57373'
    );

    const ctx = document.getElementById('attemptsChart').getContext('2d');
    if (attemptsChart) attemptsChart.destroy();
    attemptsChart = new Chart(ctx, {
      type: 'bar',
      data: {
        labels,
        datasets: [{
          label: 'URLs',
          data: counts,
          backgroundColor: colors,
          borderRadius: 4,
        }]
      },
      options: {
        plugins: { legend: { display: false } },
        scales: {
          x: { title: { display: true, text: 'Attempts needed' } },
          y: { title: { display: true, text: 'Number of URLs' }, beginAtZero: true, ticks: { precision: 0 } }
        }
      }
    });
  }
</script>
</body>
</html>
