name: PDF Generator

on:
  push:
    branches:
      - script_for_generating_PDFs
  workflow_dispatch:  

permissions:
  contents: read

jobs:
  generate-pdfs:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v3
        with:
          submodules: recursive
          fetch-depth: 0
          path: repo

      - name: Install Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '18'

      - name: Install wkhtmltopdf
        run: |
          sudo apt-get update
          sudo apt-get install -y wkhtmltopdf

      - name: Install dependencies
        run: |
          cd repo/pdf-generator
          npm ci

      - name: Generate PDFs
        run: |
          cd repo/pdf-generator
          npm run generate