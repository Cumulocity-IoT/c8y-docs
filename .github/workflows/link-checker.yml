name: Link Checker

on:
  schedule:
    - cron: '0 6 * * 1'
  workflow_dispatch:
    inputs:
      branch:
        description: 'Branch to check links on (by default checks all maintained branches)'
        required: false
        type: string
      urlsWith:
        description: 'Only check links containing this substring (by default checks all links)'
        required: false
        type: string
      diagnostics:
        description: 'Enable verbose diagnostics (every network request + console/uncaught errors) - combine with branch + urlsWith to investigate a specific failure'
        required: false
        type: boolean
        default: false
  pull_request:
    types: [labeled]

permissions:
  contents: read
  pull-requests: write
  issues: write

jobs:
  determine-branches:
    name: Determine branches to check
    runs-on: ubuntu-latest
    if: github.event_name != 'pull_request' || github.event.label.name == 'broken-link-check'
    outputs:
      branches: ${{ steps.set-branches.outputs.branches }}
    steps:
      - name: Set branches
        id: set-branches
        env:
          BRANCH_INPUT: ${{ inputs.branch }}
          EVENT_NAME: ${{ github.event_name }}
          PR_HEAD_REF: ${{ github.event.pull_request.head.ref }}
        run: |
          if [ "$EVENT_NAME" = "pull_request" ]; then
            branches_json=$(jq -cn --arg b "$PR_HEAD_REF" '[$b]')
          elif [ -n "$BRANCH_INPUT" ]; then
            branches_json=$(jq -cn --arg b "$BRANCH_INPUT" '[$b]')
          else
            branches_json='["develop", "release/y2026"]'
          fi
          echo "branches=$branches_json" >> "$GITHUB_OUTPUT"

  link-check:
    name: Run Link Check
    needs: determine-branches
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        branch: ${{ fromJson(needs.determine-branches.outputs.branches) }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          repository: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name || github.repository }}
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || matrix.branch }}

      - name: Sanitize branch name for artifact naming
        id: sanitize-branch
        env:
          BRANCH_NAME: ${{ matrix.branch }}
        run: echo "name=${BRANCH_NAME//\//-}" >> "$GITHUB_OUTPUT"

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 'latest'

      - name: Install Dependencies
        run: |
          cd broken-links-script
          npm install

      - name: Run Cypress tests
        # Failing links don't fail this job: the recheck job re-checks them on
        # a fresh runner and decides what gets reported. A run that broke
        # down is still caught there, since it leaves no complete
        # link-check-result.json behind.
        continue-on-error: true
        env:
          URLS_WITH_INPUT: ${{ inputs.urlsWith }}
          DIAGNOSTICS_INPUT: ${{ inputs.diagnostics }}
        run: |
          cd broken-links-script
          set -o pipefail
          args=()
          if [ -n "$URLS_WITH_INPUT" ]; then
            args+=("--urls-with=$URLS_WITH_INPUT")
          fi
          : > cypress-output.log
          if [ "$DIAGNOSTICS_INPUT" = "true" ]; then
            args+=("--diagnostics")
            # Runner IP is stamped once per job so Case 3 (IP-reputation
            # blocking) can be confirmed by diffing this value across
            # sibling branch runs in the same workflow run, instead of
            # inferring it purely from retry timing.
            egress_ip=$(curl -s --max-time 5 https://ifconfig.me || echo "unknown")
            echo "[DIAGNOSTIC] {\"type\":\"runner-egress-ip\",\"branch\":\"${{ matrix.branch }}\",\"ip\":\"$egress_ip\"}" | tee -a cypress-output.log
          fi
          npm test -- "${args[@]}" 2>&1 | tee -a cypress-output.log

      - name: Upload Cypress log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cypress-log-${{ steps.sanitize-branch.outputs.name }}
          path: |
            broken-links-script/cypress-output.log
            broken-links-script/link-check-result.json
          retention-days: 8

  # Links that failed the first pass are checked once more here, in a separate
  # job and so on a different runner VM - usually with a different egress IP -
  # and only after the whole first-pass matrix has finished. That gets past the
  # runner-IP blocks and short outages that the first pass's back-to-back
  # retries can't, without excluding those links from the check. Only links
  # that fail again are reported as broken.
  recheck:
    name: Re-check failures and report
    needs: [determine-branches, link-check]
    # always(): a branch whose first pass broke down must still be reported,
    # and must not skip the other branches' re-checks.
    if: always() && needs.determine-branches.result == 'success'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        branch: ${{ fromJson(needs.determine-branches.outputs.branches) }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          repository: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name || github.repository }}
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || matrix.branch }}

      - name: Sanitize branch name for artifact naming
        id: sanitize-branch
        env:
          BRANCH_NAME: ${{ matrix.branch }}
        run: echo "name=${BRANCH_NAME//\//-}" >> "$GITHUB_OUTPUT"

      - name: Download first-pass results
        # A missing artifact is reported as an incomplete run by the
        # summary step below, not as a failure of this step.
        continue-on-error: true
        uses: actions/download-artifact@v4
        with:
          name: cypress-log-${{ steps.sanitize-branch.outputs.name }}
          path: first-pass

      - name: Decide whether to re-check
        id: plan
        env:
          DIAGNOSTICS_INPUT: ${{ inputs.diagnostics }}
        # Diagnostics runs are reported straight from the first pass, which
        # is the run being investigated.
        run: |
          result=first-pass/link-check-result.json
          if [ "$DIAGNOSTICS_INPUT" != "true" ] && [ -f "$result" ] \
            && jq -e '.completed and (.failed | length > 0)' "$result" > /dev/null; then
            echo "recheck=true" >> "$GITHUB_OUTPUT"
          else
            echo "recheck=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Setup Node.js
        if: steps.plan.outputs.recheck == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: 'latest'

      - name: Install Dependencies
        if: steps.plan.outputs.recheck == 'true'
        run: |
          cd broken-links-script
          npm install

      - name: Re-check failed links
        if: steps.plan.outputs.recheck == 'true'
        continue-on-error: true
        env:
          URLS_WITH_INPUT: ${{ inputs.urlsWith }}
        # --urls-with is passed on because it also disables excludedLinks
        # (see link-checker.cy.js) - without it, an excluded link that was
        # checked on purpose in the first pass would be skipped here and
        # wrongly count as passing.
        run: |
          cd broken-links-script
          set -o pipefail
          args=("--recheck=../first-pass/link-check-result.json")
          if [ -n "$URLS_WITH_INPUT" ]; then
            args+=("--urls-with=$URLS_WITH_INPUT")
          fi
          npm test -- "${args[@]}" 2>&1 | tee recheck-output.log

      - name: Upload re-check log
        if: always() && steps.plan.outputs.recheck == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: recheck-log-${{ steps.sanitize-branch.outputs.name }}
          path: |
            broken-links-script/recheck-output.log
            broken-links-script/link-check-result.json
          retention-days: 8

      - name: Summarize results
        id: summary
        if: always()
        env:
          RECHECKED: ${{ steps.plan.outputs.recheck }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          cd broken-links-script
          args=("--first-pass=../first-pass/link-check-result.json" "--run-url=$RUN_URL")
          if [ "$RECHECKED" = "true" ]; then
            args+=("--recheck=link-check-result.json")
          fi
          node summarize-failures.cjs "${args[@]}" > link-check-report.md
          cat link-check-report.md >> "$GITHUB_STEP_SUMMARY"

      - name: Determine label based on branch
        if: always() && steps.summary.outputs.failed == 'true' && github.event_name != 'pull_request' && !inputs.branch
        id: label
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          BRANCH_NAME: ${{ matrix.branch }}
        run: |
          LABEL_NAME="broken-link-${BRANCH_NAME}"
          if gh api "repos/$GH_REPO/labels/$LABEL_NAME" &>/dev/null; then
            echo "Label ${LABEL_NAME} already exists"
          else
            echo "Creating label ${LABEL_NAME}"
            gh label create "${LABEL_NAME}" \
              --description "Indicates broken links in branch ${BRANCH_NAME}"
          fi
          echo "label=$LABEL_NAME" >> $GITHUB_OUTPUT

      - name: Create GitHub issue if links are broken
        if: always() && steps.summary.outputs.failed == 'true' && github.event_name != 'pull_request' && !inputs.branch
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          LABEL: ${{ steps.label.outputs.label }}
          BRANCH_NAME: ${{ matrix.branch }}
        run: |
          label="$LABEL"
          branch_name="$BRANCH_NAME"
          echo "Creating issue for branch: ${branch_name} with label: ${label}"

          issue_url=$(gh issue create \
            --title "Weekly Link Check Failed for ${branch_name}" \
            --body-file broken-links-script/link-check-report.md \
            --label "${label}" \
            --assignee "BeateRixen")

          echo "Result: ${issue_url}"

      - name: Post PR comment with link check summary
        if: always() && github.event_name == 'pull_request'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          # A new comment per broken-link-check label addition, so the PR
          # history shows when each check was requested and what it found.
          gh api "repos/$GH_REPO/issues/$PR_NUMBER/comments" -X POST -F body=@broken-links-script/link-check-report.md

      - name: Fail if links are broken
        # Also fails when the summary step itself broke and set no output.
        if: always() && steps.summary.outputs.failed != 'false'
        run: exit 1
