name: Link Checker

on:
  schedule:
    - cron: '0 6 * * 1'
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: write
  issues: write

env:
  MONITORED_BRANCHES: 'develop,release/y2025'

jobs:
  link-check:
    name: Run Link Check
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        branch: [develop, release/y2025]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v3
        with:
          ref: ${{ matrix.branch }}

      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: 'latest'

      - name: Install Dependencies
        run: |
          cd broken-links-script
          npm install

      - name: Run Cypress tests
        run: |
          cd broken-links-script
          npm test

      - name: Determine label based on branch
        if: always()
        id: label
        run: |
          LABEL_NAME="broken-link-${{ matrix.branch }}"
          if ! gh label list | grep -q "^${LABEL_NAME}\b"; then
            gh label create "${LABEL_NAME}" --description "Indicates broken links in branch ${{ matrix.branch }}"
          fi
          echo "label=$LABEL_NAME" >> $GITHUB_OUTPUT

      - name: Create GitHub issue if tests fail
        if: failure()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          label="${{ steps.label.outputs.label }}"
          branch_name="${{ matrix.branch }}"
          echo "Creating issue for branch: ${branch_name} with label: ${label}"

          issue_url=$(gh issue create \
            --title "Weekly Link Check Failed for ${branch_name}" \
            --body "Broken links detected in workflow run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}" \
            --label "${label}" \
            --assignee "BeateRixen")

          echo "Result: ${issue_url}"