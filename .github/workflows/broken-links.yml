name: Check Broken Links

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read
  pull-requests: write

jobs:
  check-broken-links:
    name: Broken Link Checker
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Set Up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 18

      - name: Install Dependencies
        run: |
          cd broken-links-script
          npm install

      - name: Run Broken Link Checker
        run: |
          cd broken-links-script
          node BrokenLinkChecker.js

      - name: Parse and Comment Broken Links
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const path = './broken-links-script/broken_links_report.txt';

            if (fs.existsSync(path)) {
              const data = fs.readFileSync(path, 'utf8').trim();
              const lines = data.split('\n\n'); 

              if (lines.length > 1) {
                const body = `### :warning: The following broken links were found:\n\n${lines
                  .map((line) => `- ${line.replace(/\n/g, " ")}`)
                  .join('\n')}`;

                await github.rest.issues.createComment({
                  issue_number: context.issue.number,
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  body: body
                });
                console.log("Broken links detected. PR cannot be merged until resolved.");
                core.setFailed("Broken links detected");
              }
            }
