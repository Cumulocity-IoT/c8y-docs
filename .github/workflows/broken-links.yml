name: Check Broken Links

on:
  pull_request:
    paths:
      - "**/*.md" 

permissions:
  contents: read

jobs:
  check_broken_links:
    name: Check for broken links in markdown files
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install dependencies
        run: npm install p-limit node-fetch

      - name: Run broken links checker
        id: broken-links
        run: |
          mkdir -p results
          node scripts/BrokenLinkChecker.js
          if [ -f broken_links_markdown.csv ]; then
            cat broken_links_markdown.csv
          else
            echo "No broken links detected."
          fi

      - name: Comment on Pull Request
        if: failure()
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if [ -f broken_links_markdown.csv ]; then
            echo "### Broken Links Detected" > comment.md
            echo "" >> comment.md
            echo "| URL | File | Status |" >> comment.md
            echo "| --- | ---- | ------ |" >> comment.md
            while IFS=, read -r url file status; do
              echo "| $url | $file | $status |" >> comment.md
            done < broken_links_markdown.csv
            gh pr comment ${{ github.event.pull_request.number }} --body-file comment.md
          else
            echo "No broken links detected."
