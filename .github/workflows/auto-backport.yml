name: auto-backport
on:
  pull_request_target:
    types: ["labeled", "closed"]

jobs:
  backport:
    name: Backport PR
    runs-on: [ubuntu-latest]
    if: |
      github.event.pull_request.merged == true
      && contains(github.event.pull_request.labels.*.name, 'auto-backport')
      && (
        (github.event.action == 'labeled' && github.event.label.name == 'auto-backport')
        || (github.event.action == 'closed')
      )
    steps:
      - name: Get GH App token
        id: app-token
        uses: Cumulocity-IoT/github-app-token@v3
        with:
          app_id: ${{ vars.C8Y_DOCS_AUTOMATIONS_APP_ID }}
          installation_id: ${{ vars.C8Y_DOCS_AUTOMATIONS_APP_INSTALLATION_ID }}
          private_key: ${{ secrets.C8Y_DOCS_AUTOMATIONS_APP_PRIVATE_KEY }}
          
      - name: Backport Action
        uses: sorenlouv/backport-github-action@929f69d04adbc196d982e60f02837b6cc00b3129
        with:
          github_token: ${{ steps.app-token.outputs.token }}
          auto_backport_label_prefix: auto-backport-to-
          add_original_reviewers: true

      - name: Info log
        if: ${{ success() }}
        run: cat ~/.backport/backport.info.log

      - name: Debug log
        if: ${{ failure() }}
        run: cat ~/.backport/backport.debug.log
